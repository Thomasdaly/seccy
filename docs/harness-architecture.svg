<svg viewBox="0 0 1240 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6b86"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#1f2a3a">AI authorization-testing harness — hybrid local + hosted-open stack</text>
  <text x="20" y="56" font-size="12" fill="#5b6b86">Model-agnostic orchestrator · local models for high-volume glue · hosted open models for reasoning · frontier only for hard steps · authorized targets only</text>

  <!-- G1 Control plane -->
  <rect x="20" y="72" width="1200" height="96" rx="10" fill="#eef2f7" stroke="#c3ccd9"/>
  <text x="34" y="91" font-size="11" font-weight="700" fill="#5b6b86" letter-spacing="1">CONTROL PLANE</text>
  <rect x="40" y="102" width="190" height="52" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
  <text x="135" y="133" font-size="13" font-weight="600" fill="#1f2a3a" text-anchor="middle">Operator / CLI</text>
  <rect x="290" y="99" width="430" height="58" rx="8" fill="#dbe8ff" stroke="#5b8def"/>
  <text x="505" y="123" font-size="13" font-weight="700" fill="#1f2a3a" text-anchor="middle">Orchestrator (LangGraph)</text>
  <text x="505" y="142" font-size="11" fill="#38506e" text-anchor="middle">plan → probe → observe → judge → report</text>
  <rect x="770" y="102" width="430" height="52" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
  <text x="985" y="133" font-size="13" font-weight="600" fill="#1f2a3a" text-anchor="middle">LiteLLM Router — route by task cost/tier</text>
  <line x1="230" y1="128" x2="286" y2="128" stroke="#5b6b86" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="720" y1="128" x2="766" y2="128" stroke="#5b6b86" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- G2 Model routing -->
  <rect x="20" y="182" width="1200" height="150" rx="10" fill="#eef2f7" stroke="#c3ccd9"/>
  <text x="34" y="201" font-size="11" font-weight="700" fill="#5b6b86" letter-spacing="1">MODEL ROUTING (SWAPPABLE)</text>
  <rect x="40" y="214" width="372" height="104" rx="8" fill="#eaf6ec" stroke="#7bbf88"/>
  <text x="226" y="241" font-size="12" font-weight="700" fill="#1f2a3a" text-anchor="middle">Tier 0 · Local — M1 MLX / 2060 Ollama</text>
  <text x="226" y="262" font-size="11" fill="#2f4a39" text-anchor="middle">Qwen3-8B · GLM-4-9B · bge-m3</text>
  <text x="226" y="282" font-size="11" fill="#5b6b86" text-anchor="middle">classify · normalize · embed · dedup</text>
  <text x="226" y="304" font-size="11" font-weight="600" fill="#2f7a4a" text-anchor="middle">free · no refusals · data local</text>
  <rect x="434" y="214" width="372" height="104" rx="8" fill="#e9eefb" stroke="#5b8def"/>
  <text x="620" y="241" font-size="12" font-weight="700" fill="#1f2a3a" text-anchor="middle">Tier 1 · Hosted open (OpenRouter)</text>
  <text x="620" y="262" font-size="11" fill="#38506e" text-anchor="middle">GLM-4.6 · DeepSeek-V3 · Qwen3-235B</text>
  <text x="620" y="282" font-size="11" fill="#5b6b86" text-anchor="middle">probe planning</text>
  <text x="620" y="304" font-size="11" font-weight="600" fill="#3a63c0" text-anchor="middle">~1/6 frontier cost</text>
  <rect x="828" y="214" width="372" height="104" rx="8" fill="#fdf0e9" stroke="#d98b5b"/>
  <text x="1014" y="241" font-size="12" font-weight="700" fill="#1f2a3a" text-anchor="middle">Tier 2 · Frontier API (Cyber-verified)</text>
  <text x="1014" y="262" font-size="11" fill="#6e4328" text-anchor="middle">Claude · GPT</text>
  <text x="1014" y="282" font-size="11" fill="#5b6b86" text-anchor="middle">hard chains · final finding judgment</text>
  <text x="1014" y="304" font-size="11" font-weight="600" fill="#b5652f" text-anchor="middle">called only when it earns its cost</text>
  <line x1="985" y1="156" x2="300" y2="210" stroke="#5b6b86" stroke-width="1.2" marker-end="url(#arw)" opacity="0.7"/>
  <line x1="985" y1="156" x2="620" y2="210" stroke="#5b6b86" stroke-width="1.2" marker-end="url(#arw)" opacity="0.7"/>
  <line x1="985" y1="156" x2="1014" y2="210" stroke="#5b6b86" stroke-width="1.2" marker-end="url(#arw)" opacity="0.7"/>

  <!-- G3 Capability -->
  <rect x="20" y="346" width="1200" height="120" rx="10" fill="#eef2f7" stroke="#c3ccd9"/>
  <text x="34" y="365" font-size="11" font-weight="700" fill="#5b6b86" letter-spacing="1">CAPABILITY LAYER (agent tools)</text>
  <g font-size="12" font-weight="600" fill="#1f2a3a" text-anchor="middle">
    <rect x="40" y="378" width="219" height="72" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="149" y="408">Identity Manager</text>
    <text x="149" y="427" font-size="11" font-weight="400" fill="#5b6b86">N users × M tenants × roles</text>
    <rect x="275" y="378" width="219" height="72" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="384" y="408">Recon &amp; Surface Map</text>
    <text x="384" y="427" font-size="11" font-weight="400" fill="#5b6b86">OpenAPI · GraphQL · APK</text>
    <rect x="510" y="378" width="219" height="72" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="619" y="408">HTTP Replay Engine</text>
    <text x="619" y="427" font-size="11" font-weight="400" fill="#5b6b86">httpx · Caido · Burp MCP</text>
    <rect x="745" y="378" width="219" height="72" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="854" y="408">Playwright</text>
    <text x="854" y="427" font-size="11" font-weight="400" fill="#5b6b86">authenticated login flows</text>
    <rect x="980" y="378" width="219" height="72" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="1089" y="408">Evidence Collector</text>
    <text x="1089" y="427" font-size="11" font-weight="400" fill="#5b6b86">req/resp · replayable PoC</text>
  </g>
  <line x1="737" y1="332" x2="737" y2="374" stroke="#5b6b86" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- G4 State / isolation / observability -->
  <rect x="20" y="480" width="1200" height="150" rx="10" fill="#eef2f7" stroke="#c3ccd9"/>
  <text x="34" y="499" font-size="11" font-weight="700" fill="#5b6b86" letter-spacing="1">STATE · ISOLATION · OBSERVABILITY</text>
  <g font-size="12" font-weight="600" fill="#1f2a3a" text-anchor="middle">
    <rect x="40" y="512" width="219" height="96" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="149" y="548">Vector DB</text>
    <text x="149" y="567" font-size="11" font-weight="400" fill="#5b6b86">Qdrant / LanceDB</text>
    <text x="149" y="584" font-size="11" font-weight="400" fill="#5b6b86">dedup findings</text>
    <rect x="275" y="512" width="219" height="96" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="384" y="548">Findings DB</text>
    <text x="384" y="567" font-size="11" font-weight="400" fill="#5b6b86">Postgres</text>
    <rect x="510" y="512" width="219" height="96" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="619" y="548">Artifact Store</text>
    <text x="619" y="567" font-size="11" font-weight="400" fill="#5b6b86">blobs · screenshots</text>
    <rect x="745" y="512" width="219" height="96" rx="8" fill="#fdf0e9" stroke="#d98b5b"/>
    <text x="854" y="548">Repro Sandbox</text>
    <text x="854" y="567" font-size="11" font-weight="400" fill="#6e4328">ephemeral Docker</text>
    <text x="854" y="584" font-size="11" font-weight="700" fill="#b5652f">isolated from creds</text>
    <rect x="980" y="512" width="219" height="96" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
    <text x="1089" y="548">Langfuse</text>
    <text x="1089" y="567" font-size="11" font-weight="400" fill="#5b6b86">traces · token cost</text>
  </g>
  <line x1="737" y1="466" x2="737" y2="508" stroke="#5b6b86" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- G5 Targets -->
  <rect x="20" y="644" width="1200" height="106" rx="10" fill="#eef2f7" stroke="#c3ccd9"/>
  <text x="34" y="663" font-size="11" font-weight="700" fill="#5b6b86" letter-spacing="1">TARGETS — AUTHORIZED ONLY</text>
  <rect x="40" y="676" width="760" height="58" rx="8" fill="#eaf6ec" stroke="#7bbf88"/>
  <text x="420" y="701" font-size="13" font-weight="700" fill="#1f2a3a" text-anchor="middle">Authorized scope — bounty program · client SoW</text>
  <text x="420" y="720" font-size="11" fill="#2f4a39" text-anchor="middle">allowlist · rate-limit · kill-switch enforced in the harness</text>
  <rect x="816" y="676" width="383" height="58" rx="8" fill="#ffffff" stroke="#9aa5b5"/>
  <text x="1007" y="701" font-size="13" font-weight="600" fill="#1f2a3a" text-anchor="middle">Local lab (offline, on 2060)</text>
  <text x="1007" y="720" font-size="11" fill="#5b6b86" text-anchor="middle">Juice Shop · crAPI · VAmPI · planted bugs</text>
  <line x1="854" y1="608" x2="560" y2="672" stroke="#5b6b86" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="712" y="648" font-size="10" fill="#5b6b86" text-anchor="middle">replay (sandboxed)</text>

  <!-- G6 Hardware mesh -->
  <rect x="20" y="768" width="1200" height="110" rx="10" fill="#f2eefb" stroke="#b9a8e0"/>
  <text x="34" y="787" font-size="11" font-weight="700" fill="#6a579e" letter-spacing="1">HARDWARE — TAILSCALE MESH</text>
  <g font-size="13" font-weight="600" fill="#1f2a3a" text-anchor="middle">
    <rect x="40" y="800" width="572" height="60" rx="8" fill="#ffffff" stroke="#b9a8e0"/>
    <text x="326" y="826">M1 laptop</text>
    <text x="326" y="845" font-size="11" font-weight="400" fill="#5b6b86">dev · orchestrator · MLX reasoning + embeddings · holds target session tokens</text>
    <rect x="628" y="800" width="572" height="60" rx="8" fill="#ffffff" stroke="#b9a8e0"/>
    <text x="914" y="826">RTX 2060 laptop (Windows + WSL2)</text>
    <text x="914" y="845" font-size="11" font-weight="400" fill="#5b6b86">WSL2 Ubuntu · Ollama · Docker services · repro sandbox · offline lab</text>
  </g>
</svg>
