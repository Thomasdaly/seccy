model_list:
  # Tier 0 — local, free, high-volume glue
  - model_name: glue
    litellm_params: { model: ollama/qwen3:8b, api_base: http://host.docker.internal:11434, think: false, keep_alive: "-1m" }   # no reasoning tokens; stay loaded
  - model_name: embed
    litellm_params: { model: ollama/bge-m3-cpu, api_base: http://host.docker.internal:11434, keep_alive: "-1m" }   # CPU-only copy: keeps the 6 GB GPU for qwen3
  # Tier 1 — hosted open, cheap reasoning (~1/16–1/20 frontier cost)
  - model_name: planner
    # LiteLLM has no price for this model, so spend logged as $0. OpenRouter list
    # price as of 2026-11-19 ($0.50 / $2.00 per M tokens); recheck when it changes.
    litellm_params: { model: openrouter/z-ai/glm-4.6, input_cost_per_token: 0.0000005, output_cost_per_token: 0.000002 }
  # Tier 2 — frontier, hard steps only
  - model_name: judge
    # Price it so judge spend is metered (principle 5). Not in LiteLLM's built-in
    # cost map, so without this its cost logs as $0. Claude Fable 5.2 list price
    # $8 / $40 per M tokens (guide §2); recheck when it changes.
    litellm_params: { model: anthropic/claude-fable-5-2, input_cost_per_token: 0.000008, output_cost_per_token: 0.00004 }   # rare by design: final verdicts + stalled runs
litellm_settings:                    # keys: LANGFUSE_PUBLIC_KEY/SECRET_KEY/HOST in .env
  success_callback: ["langfuse"]     # every call → cost + trace
  failure_callback: ["langfuse"]
  drop_params: true                  # silently drop params a model rejects (e.g.
                                     # Anthropic has no `temperature`), rather than 400
