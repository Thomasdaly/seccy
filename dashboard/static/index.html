<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Cpath d='M4 11V5m4 6V7m4 4V3' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4"/><path d="M4 11V5m4 6V7m4 4V3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      Harness <span class="muted">console</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-tab="health">Health</button>
      <button role="tab" data-tab="trends">Trends</button>
      <button role="tab" data-tab="flows">Flows</button>
      <button role="tab" data-tab="raw">Raw</button>
    </nav>
    <div class="top-right">
      <span id="stack-pill" class="pill" hidden></span>
      <span id="updated" class="muted small"></span>
    </div>
  </header>
  <div id="demo-banner" class="demo-banner" hidden>
    <strong>Demo data.</strong> Synthetic runs, not your stack. Unset <code>DASHBOARD_DEMO</code> to read the live services.
  </div>
  <div class="filters">
    <div id="range" class="seg" role="radiogroup" aria-label="Time range"></div>
    <label class="toggle"><input type="checkbox" id="auto" checked> Auto-refresh 30s</label>
    <button id="refresh" class="btn">Refresh</button>
  </div>
  <main id="main">
    <section id="tab-health" class="tab" role="tabpanel" hidden></section>
    <section id="tab-trends" class="tab" role="tabpanel" hidden></section>
    <section id="tab-flows" class="tab" role="tabpanel" hidden></section>
    <section id="tab-raw" class="tab" role="tabpanel" hidden></section>
  </main>
  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Record detail">
    <header><h3 id="drawer-title"></h3><button id="drawer-close" class="btn">Close</button></header>
    <pre id="drawer-body"></pre>
  </aside>
  <script type="module" src="app.js"></script>
</body>
</html>
