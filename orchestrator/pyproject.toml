[project]
name = "harness"
version = "0.1.0"
description = "Orchestrator for the authorized authorization-testing harness (runs on the M1)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "litellm>=1.110.0",
    "playwright>=1.65.2",
    "psycopg[binary]>=3.3.9",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.20.0",
]

[project.scripts]
harness = "harness:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
