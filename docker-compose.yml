# Services runner (2060 / WSL2). Ports bind to TAILNET_IP only, so nothing is
# exposed on the LAN (WSL mirrored networking would otherwise publish to it).
# Needs tailscale0 up before Docker starts; see README.
x-common: &common
  restart: unless-stopped

services:
  litellm:
    <<: *common
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes: ["./litellm.config.yaml:/app/config.yaml:ro"]
    ports: ["${TAILNET_IP:-127.0.0.1}:4000:4000"]
    env_file: .env            # LITELLM_MASTER_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY, LANGFUSE_*
    extra_hosts: ["host.docker.internal:host-gateway"]

  qdrant:
    <<: *common
    image: qdrant/qdrant:latest
    ports: ["${TAILNET_IP:-127.0.0.1}:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  postgres:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["${TAILNET_IP:-127.0.0.1}:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pinned to v2: v3 additionally needs ClickHouse, Redis and S3/MinIO.
  langfuse:
    <<: *common
    image: langfuse/langfuse:2
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${TAILNET_IP:-127.0.0.1}:3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      NEXTAUTH_URL: http://${TAILNET_IP:-127.0.0.1}:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      TELEMETRY_ENABLED: "false"
      AUTH_DISABLE_SIGNUP: "true"
      # Headless init: creates org/project/user and the API keys LiteLLM logs with
      LANGFUSE_INIT_ORG_ID: harness
      LANGFUSE_INIT_ORG_NAME: harness
      LANGFUSE_INIT_PROJECT_ID: harness
      LANGFUSE_INIT_PROJECT_NAME: harness
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@harness.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD in .env}

volumes:
  pgdata:
  qdrant_data:
